<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 스마트 여행 플래너</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pretendard & Inter 폰트 (가독성 최적화) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        /* 스크롤바 숨김 처리 (가로 스크롤 칩 등) */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 부드러운 카드 등장 애니메이션 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-700">

    <!-- 모바일 앱 컨테이너 (최대 너비 제한으로 데스크탑에서도 앱처럼 중앙 정렬) -->
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl shadow-slate-200/60 flex flex-col relative pb-12">
        
        <!-- 상단 헤더 -->
        <header class="sticky top-0 z-30 bg-white/85 backdrop-blur-md border-b border-slate-100 px-5 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-blue-500 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                    <i data-lucide="compass" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-slate-900 leading-none">트립지니 AI</h1>
                    <p class="text-[11px] text-slate-500 font-medium mt-1">나만의 맞춤형 스마트 여행 일정</p>
                </div>
            </div>
            <span id="modeBadge" class="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 border border-amber-200/80">
                예시 모드
            </span>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main class="flex-1 px-5 pt-5 space-y-6">
            
            <!-- 1. 여행 조건 입력 폼 섹션 -->
            <section class="bg-slate-50/80 rounded-2xl p-4 border border-slate-100 space-y-4">
                
                <!-- 여행지 입력 -->
                <div>
                    <label for="destination" class="block text-xs font-bold text-slate-700 mb-1.5 flex items-center gap-1.5">
                        <i data-lucide="map-pin" class="w-3.5 h-3.5 text-indigo-600"></i> 어디로 떠나시나요?
                    </label>
                    <input type="text" id="destination" placeholder="예: 제주도, 도쿄, 강릉, 파리" value="제주도"
                        class="w-full px-3.5 py-3 bg-white border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all placeholder:text-slate-400">
                </div>

                <!-- 기간 선택 -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5 flex items-center gap-1.5">
                        <i data-lucide="calendar" class="w-3.5 h-3.5 text-indigo-600"></i> 여행 기간
                    </label>
                    <div class="grid grid-cols-4 gap-2" id="durationGroup">
                        <button type="button" data-value="당일치기" class="duration-btn py-2.5 px-1 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-all">당일치기</button>
                        <button type="button" data-value="1박 2일" class="duration-btn py-2.5 px-1 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-all">1박 2일</button>
                        <button type="button" data-value="2박 3일" class="duration-btn active py-2.5 px-1 rounded-xl text-xs font-bold border-indigo-600 bg-indigo-600 text-white shadow-sm transition-all">2박 3일</button>
                        <button type="button" data-value="3박 4일" class="duration-btn py-2.5 px-1 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-all">3박 4일</button>
                    </div>
                </div>

                <!-- 동행인 선택 -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5 flex items-center gap-1.5">
                        <i data-lucide="users" class="w-3.5 h-3.5 text-indigo-600"></i> 누구와 함께 가나요?
                    </label>
                    <div class="grid grid-cols-3 gap-2" id="companionGroup">
                        <button type="button" data-value="혼자서" class="companion-btn py-2.5 px-2 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 transition-all">🧳 혼자서</button>
                        <button type="button" data-value="연인과" class="companion-btn active py-2.5 px-2 rounded-xl text-xs font-bold border-indigo-600 bg-indigo-50 text-indigo-700 transition-all">💑 연인과</button>
                        <button type="button" data-value="친구와" class="companion-btn py-2.5 px-2 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 transition-all">👯 친구와</button>
                        <button type="button" data-value="아이와 함께" class="companion-btn py-2.5 px-2 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 transition-all">👶 아이와</button>
                        <button type="button" data-value="부모님과" class="companion-btn py-2.5 px-2 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 transition-all">👨‍👩‍👧 부모님과</button>
                        <button type="button" data-value="반려동물과" class="companion-btn py-2.5 px-2 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 transition-all">🐶 반려동물</button>
                    </div>
                </div>

                <!-- 관심사 / 테마 (다중 선택 가능) -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5 flex items-center justify-between">
                        <span class="flex items-center gap-1.5"><i data-lucide="sparkles" class="w-3.5 h-3.5 text-indigo-600"></i> 관심사 및 테마</span>
                        <span class="text-[11px] font-normal text-slate-400">중복 선택 가능</span>
                    </label>
                    <div class="flex flex-wrap gap-2" id="interestGroup">
                        <button type="button" data-value="맛집 탐방" class="interest-btn active px-3 py-2 rounded-full text-xs font-bold bg-indigo-600 text-white border border-indigo-600 transition-all">🍽️ 맛집 탐방</button>
                        <button type="button" data-value="감성 카페" class="interest-btn active px-3 py-2 rounded-full text-xs font-bold bg-indigo-600 text-white border border-indigo-600 transition-all">☕ 감성 카페</button>
                        <button type="button" data-value="자연/힐링" class="interest-btn px-3 py-2 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 transition-all">🌿 자연/힐링</button>
                        <button type="button" data-value="인생샷/명소" class="interest-btn px-3 py-2 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 transition-all">📸 인생샷</button>
                        <button type="button" data-value="액티비티" class="interest-btn px-3 py-2 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 transition-all">🏄 액티비티</button>
                        <button type="button" data-value="쇼핑/소품샵" class="interest-btn px-3 py-2 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 transition-all">🛍️ 소품샵</button>
                        <button type="button" data-value="문화/전시" class="interest-btn px-3 py-2 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 transition-all">🎨 전시/예술</button>
                    </div>
                </div>

                <!-- 일정 생성 버튼 -->
                <button id="generateBtn" type="button"
                    class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 active:scale-[0.99] text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-200 flex items-center justify-center gap-2 transition-all">
                    <i data-lucide="wand-2" class="w-4 h-4"></i>
                    <span>맞춤 여행 일정 만들기</span>
                </button>
            </section>

            <!-- 커스텀 알림 토스트 (alert 대체) -->
            <div id="toastMessage" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 backdrop-blur-sm text-white text-xs font-medium px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 transition-all max-w-[90%]">
                <i data-lucide="info" class="w-4 h-4 text-indigo-400 shrink-0"></i>
                <span id="toastText">메시지 내용</span>
            </div>

            <!-- 2. 로딩 스켈레톤 UI (API 호출 시 표시) -->
            <section id="loadingSection" class="hidden space-y-4 py-4">
                <div class="flex flex-col items-center justify-center text-center py-6 space-y-3">
                    <div class="w-12 h-12 rounded-2xl bg-indigo-50 flex items-center justify-center text-indigo-600 animate-bounce">
                        <i data-lucide="plane" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="text-sm font-bold text-slate-800">AI가 최적의 동선을 짜고 있어요...</p>
                        <p class="text-xs text-slate-500 mt-1">맛집과 이동 거리까지 꼼꼼하게 계산 중입니다</p>
                    </div>
                </div>
                <!-- 스켈레톤 카드 -->
                <div class="rounded-2xl border border-slate-100 p-4 space-y-3 animate-pulse">
                    <div class="h-5 bg-slate-200 rounded-md w-1/3"></div>
                    <div class="h-16 bg-slate-100 rounded-xl w-full"></div>
                    <div class="h-16 bg-slate-100 rounded-xl w-full"></div>
                </div>
            </section>

            <!-- 3. 결과 일정 카드 리스트 섹션 -->
            <section id="resultSection" class="space-y-4">
                <!-- 결과 헤더 및 복사 버튼 -->
                <div class="flex items-center justify-between pt-1">
                    <div>
                        <h2 id="resultTitle" class="text-base font-bold text-slate-900">제주도 2박 3일 추천 일정</h2>
                        <p id="resultSubtitle" class="text-xs text-slate-500 mt-0.5">연인과 함께하는 맛집 탐방 · 감성 카페 코스</p>
                    </div>
                    <button id="copyBtn" type="button" title="일정 텍스트 복사"
                        class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 transition-all flex items-center gap-1.5 text-xs font-semibold">
                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                        <span>복사</span>
                    </button>
                </div>

                <!-- 일차별 카드가 렌더링되는 컨테이너 -->
                <div id="itineraryCards" class="space-y-5">
                    <!-- 자바스크립트로 동적 삽입됨 -->
                </div>
            </section>

        </main>
    </div>

    <script>
        // Lucide 아이콘 초기화
        lucide.createIcons();

        // ==========================================
        // 1. 상태 관리 (State)
        // ==========================================
        const state = {
            destination: '제주도',
            duration: '2박 3일',
            companion: '연인과',
            interests: ['맛집 탐방', '감성 카페'],
            currentItinerary: []
        };

        // ==========================================
        // 2. DOM 요소 참조
        // ==========================================
        const destinationInput = document.getElementById('destination');
        const durationBtns = document.querySelectorAll('.duration-btn');
        const companionBtns = document.querySelectorAll('.companion-btn');
        const interestBtns = document.querySelectorAll('.interest-btn');
        const generateBtn = document.getElementById('generateBtn');
        const loadingSection = document.getElementById('loadingSection');
        const resultSection = document.getElementById('resultSection');
        const itineraryCards = document.getElementById('itineraryCards');
        const resultTitle = document.getElementById('resultTitle');
        const resultSubtitle = document.getElementById('resultSubtitle');
        const modeBadge = document.getElementById('modeBadge');
        const copyBtn = document.getElementById('copyBtn');
        const toastMessage = document.getElementById('toastMessage');
        const toastText = document.getElementById('toastText');

        // ==========================================
        // 3. UI 인터랙션 핸들러
        // ==========================================
        
        // 토스트 메시지 표시 함수 (alert 대체)
        let toastTimeout;
        function showToast(msg) {
            toastText.textContent = msg;
            toastMessage.classList.remove('hidden');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastMessage.classList.add('hidden');
            }, 3000);
        }

        // 기간 버튼 단일 선택
        durationBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                durationBtns.forEach(b => {
                    b.className = 'duration-btn py-2.5 px-1 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-all';
                });
                btn.className = 'duration-btn active py-2.5 px-1 rounded-xl text-xs font-bold border-indigo-600 bg-indigo-600 text-white shadow-sm transition-all';
                state.duration = btn.dataset.value;
            });
        });

        // 동행인 버튼 단일 선택
        companionBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                companionBtns.forEach(b => {
                    b.className = 'companion-btn py-2.5 px-2 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 transition-all';
                });
                btn.className = 'companion-btn active py-2.5 px-2 rounded-xl text-xs font-bold border-indigo-600 bg-indigo-50 text-indigo-700 transition-all';
                state.companion = btn.dataset.value;
            });
        });

        // 관심사 버튼 다중 선택 토글
        interestBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const val = btn.dataset.value;
                const isSelected = state.interests.includes(val);

                if (isSelected) {
                    if (state.interests.length === 1) {
                        showToast('최소 1개 이상의 관심사를 선택해주세요.');
                        return;
                    }
                    state.interests = state.interests.filter(item => item !== val);
                    btn.className = 'interest-btn px-3 py-2 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 transition-all';
                } else {
                    state.interests.push(val);
                    btn.className = 'interest-btn active px-3 py-2 rounded-full text-xs font-bold bg-indigo-600 text-white border border-indigo-600 transition-all';
                }
            });
        });

        // ==========================================
        // 4. 예시 데이터 생성기 (백엔드 /api/plan 미구현 시 사용)
        // ==========================================
        function getFallbackItinerary(dest, duration, companion, interests) {
            const cleanDest = dest.trim() || '제주도';
            const mainTheme = interests.slice(0, 2).join(' & ');
            
            // 기간에 따른 일수 계산
            let daysCount = 3;
            if (duration === '당일치기') daysCount = 1;
            else if (duration === '1박 2일') daysCount = 2;
            else if (duration === '2박 3일') daysCount = 3;
            else if (duration === '3박 4일') daysCount = 4;

            const sampleDays = [
                {
                    day: 1,
                    theme: `${cleanDest} 도착 & 설레는 첫날 코스`,
                    activities: [
                        { time: '10:30', title: `${cleanDest} 도착 및 렌터카/교통 체크`, desc: '여유롭게 짐을 정리하고 첫 목적지로 이동합니다.', tag: '이동' },
                        { time: '12:00', title: `현지인 추천 ${cleanDest} 로컬 맛집`, desc: `${companion} 함께 즐기기 좋은 시그니처 메뉴로 든든한 첫 식사!`, tag: interests[0] || '맛집' },
                        { time: '14:30', title: `오션뷰 감성 로스터리 카페`, desc: '탁 트인 풍경을 바라보며 시그니처 음료와 디저트 타임.', tag: interests[1] || '카페' },
                        { time: '17:00', title: `${cleanDest} 대표 해안 산책로 & 노을 명소`, desc: '해 질 녘 황금빛 노을을 배경으로 인생샷 남기기 좋은 스팟.', tag: '명소' },
                        { time: '19:30', title: '분위기 좋은 저녁 다이닝 & 숙소 체크인', desc: '하루의 피로를 풀며 즐기는 근사한 저녁 식사.', tag: '식사' }
                    ]
                },
                {
                    day: 2,
                    theme: `${mainTheme} 집중 탐방 데이`,
                    activities: [
                        { time: '09:30', title: '브런치 카페에서 여유로운 아침', desc: '신선한 로컬 식재료로 만든 브런치와 모닝 커피.', tag: '카페' },
                        { time: '11:30', title: `${cleanDest} 시그니처 테마 스팟 투어`, desc: `${companion} 취향을 저격하는 필수 방문 코스를 여유롭게 둘러봅니다.`, tag: interests[0] || '테마' },
                        { time: '14:00', title: '줄 서서 먹는 인기 점심 핫플', desc: '웨이팅이 아깝지 않은 특별한 한 끼 식사.', tag: '맛집' },
                        { time: '16:00', title: '감성 소품샵 & 골목길 투어', desc: '아기자기한 기념품과 로컬 브랜드 굿즈를 구경하는 시간.', tag: '쇼핑' },
                        { time: '19:00', title: '야경 명소 산책 및 야시장 먹거리', desc: '밤이 더 아름다운 거리에서 즐기는 다채로운 야식 투어.', tag: '야경' }
                    ]
                },
                {
                    day: 3,
                    theme: '여유로운 힐링과 아쉬운 마무리',
                    activities: [
                        { time: '10:00', title: '숙소 체크아웃 & 숲길 힐링 산책', desc: '맑은 공기를 마시며 천천히 걷는 마지막 날 오전.', tag: '힐링' },
                        { time: '12:30', title: '공항/역 근처 마지막 로컬 맛집', desc: '집으로 돌아가기 전 꼭 맛봐야 할 별미 요리.', tag: '맛집' },
                        { time: '14:30', title: '베이커리 카페 & 선물 포장', desc: '소중한 사람들에게 건넬 특산품과 디저트 구매.', tag: '쇼핑' },
                        { time: '16:30', title: `${cleanDest} 출발 및 귀가`, desc: '즐거웠던 추억을 가득 안고 안전하게 집으로 돌아갑니다.', tag: '이동' }
                    ]
                },
                {
                    day: 4,
                    theme: '숨은 명소까지 완벽 정복하는 날',
                    activities: [
                        { time: '10:00', title: '프라이빗 스팟 & 모닝 티타임', desc: '관광객이 붐비기 전 조용히 즐기는 아침의 여유.', tag: '힐링' },
                        { time: '12:30', title: '현지 셰프의 특선 런치 코스', desc: '여행의 대미를 장식하는 특별한 미식 경험.', tag: '맛집' },
                        { time: '15:00', title: '기념품 정리 및 공항/역 이동', desc: '여유 있게 출발지로 이동하며 일정을 마무리합니다.', tag: '이동' }
                    ]
                }
            ];

            return sampleDays.slice(0, daysCount);
        }

        // ==========================================
        // 5. API 호출 및 Fallback 로직 (/api/plan 연동)
        // ==========================================
        async function fetchTravelPlan() {
            const destination = destinationInput.value.trim();
            if (!destination) {
                showToast('여행지를 입력해주세요! (예: 제주도, 부산, 도쿄)');
                destinationInput.focus();
                return;
            }
            state.destination = destination;

            // UI 상태 변경: 로딩 표시
            generateBtn.disabled = true;
            generateBtn.classList.add('opacity-70', 'cursor-not-allowed');
            resultSection.classList.add('hidden');
            loadingSection.classList.remove('hidden');

            try {
                // Vercel Serverless Function (/api/plan) 호출 시도
                // 백엔드에서는 { days: [ { day: 1, theme: "...", activities: [ { time, title, desc, tag } ] } ] } 형태로 응답하도록 구성하세요.
                const response = await fetch('/api/plan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        destination: state.destination,
                        duration: state.duration,
                        companion: state.companion,
                        interests: state.interests
                    })
                });

                if (!response.ok) {
                    throw new Error(`API 응답 오류 (${response.status})`);
                }

                const data = await response.json();
                
                // 정상적으로 Gemini API 응답을 받은 경우
                if (data && Array.isArray(data.days) && data.days.length > 0) {
                    state.currentItinerary = data.days;
                    modeBadge.textContent = 'AI 실시간 생성';
                    modeBadge.className = 'text-[11px] font-semibold px-2.5 py-1 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200';
                    renderItinerary(state.currentItinerary);
                } else {
                    throw new Error('올바르지 않은 일정 데이터 형식');
                }

            } catch (error) {
                // /api/plan 엔드포인트가 아직 없거나 로컬 테스트 환경일 때 자연스럽게 예시 데이터로 폴백
                console.info('[/api/plan] 엔드포인트가 아직 연결되지 않아 예시 일정을 표시합니다:', error.message);
                
                // 실제 AI가 생성하는 듯한 자연스러운 딜레이 (0.7초)
                await new Promise(resolve => setTimeout(resolve, 700));
                
                state.currentItinerary = getFallbackItinerary(
                    state.destination,
                    state.duration,
                    state.companion,
                    state.interests
                );
                
                modeBadge.textContent = '예시 일정 모드';
                modeBadge.className = 'text-[11px] font-semibold px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 border border-amber-200/80';
                renderItinerary(state.currentItinerary);
                showToast('현재 /api/plan 연결 전이므로 맞춤 예시 일정을 보여드려요.');
            } finally {
                // UI 복구
                generateBtn.disabled = false;
                generateBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                loadingSection.classList.add('hidden');
                resultSection.classList.remove('hidden');
            }
        }

        // ==========================================
        // 6. 하루별 일정 카드 렌더링 함수
        // ==========================================
        function renderItinerary(days) {
            resultTitle.textContent = `${state.destination} ${state.duration} 추천 일정`;
            resultSubtitle.textContent = `${state.companion} 함께하는 ${state.interests.join(' · ')} 코스`;

            itineraryCards.innerHTML = '';

            days.forEach((dayData, index) => {
                const card = document.createElement('article');
                card.className = 'bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden animate-fade-in-up';
                card.style.animationDelay = `${index * 0.1}s`;

                // 타임라인 아이템 HTML 생성
                const activitiesHtml = dayData.activities.map((act, actIdx) => {
                    const isLast = actIdx === dayData.activities.length - 1;
                    return `
                        <div class="relative pl-6 ${isLast ? '' : 'pb-5'}">
                            <!-- 타임라인 세로선 -->
                            ${!isLast ? '<div class="absolute left-[7px] top-5 bottom-0 w-[1.5px] bg-slate-200"></div>' : ''}
                            <!-- 타임라인 점 -->
                            <div class="absolute left-0 top-1.5 w-4 h-4 rounded-full bg-indigo-50 border-2 border-indigo-600 flex items-center justify-center"></div>
                            
                            <div class="flex items-start justify-between gap-2">
                                <span class="text-xs font-bold text-indigo-600 tracking-tight">${act.time}</span>
                                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 shrink-0">${act.tag || '일정'}</span>
                            </div>
                            <h4 class="text-sm font-bold text-slate-800 mt-0.5">${act.title}</h4>
                            <p class="text-xs text-slate-500 mt-1 leading-relaxed">${act.desc}</p>
                        </div>
                    `;
                }).join('');

                card.innerHTML = `
                    <!-- 카드 상단 Day 헤더 -->
                    <div class="bg-gradient-to-r from-slate-800 to-slate-900 px-4 py-3 text-white flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="px-2.5 py-0.5 rounded-lg bg-indigo-500 text-white text-xs font-extrabold tracking-wide">
                                DAY ${dayData.day}
                            </span>
                            <h3 class="text-xs sm:text-sm font-semibold text-slate-100 truncate max-w-[210px]">
                                ${dayData.theme}
                            </h3>
                        </div>
                    </div>
                    <!-- 카드 본문 타임라인 -->
                    <div class="p-4 pt-5">
                        ${activitiesHtml}
                    </div>
                `;

                itineraryCards.appendChild(card);
            });
        }

        // ==========================================
        // 7. 일정 텍스트 클립보드 복사 기능
        // ==========================================
        copyBtn.addEventListener('click', () => {
            if (!state.currentItinerary.length) return;

            let copyText = `✈️ [${state.destination} ${state.duration} 맞춤 여행 일정]\n`;
            copyText += `동행: ${state.companion} | 테마: ${state.interests.join(', ')}\n\n`;

            state.currentItinerary.forEach(d => {
                copyText += `📌 DAY ${d.day} - ${d.theme}\n`;
                d.activities.forEach(a => {
                    copyText += `  • ${a.time} ${a.title} (${a.desc})\n`;
                });
                copyText += `\n`;
            });

            // iFrame 환경에서도 안전하게 동작하는 execCommand 방식 사용
            const textArea = document.createElement('textarea');
            textArea.value = copyText;
            textArea.style.position = 'fixed';
            textArea.style.left = '-9999px';
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('일정이 클립보드에 복사되었습니다! 카카오톡 등에 붙여넣어 보세요.');
            } catch (err) {
                showToast('복사에 실패했습니다. 다시 시도해주세요.');
            }
            document.body.removeChild(textArea);
        });

        // 버튼 클릭 및 엔터키 이벤트 연결
        generateBtn.addEventListener('click', fetchTravelPlan);
        destinationInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchTravelPlan();
        });

        // ==========================================
        // 8. 초기 실행 (페이지 로드 시 기본 예시 일정 표시)
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            state.currentItinerary = getFallbackItinerary(
                state.destination,
                state.duration,
                state.companion,
                state.interests
            );
            renderItinerary(state.currentItinerary);
        });
    </script>
</body>
</html>
